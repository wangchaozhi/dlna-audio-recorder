<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DLNA Audio Recorder</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2f;--muted:#8ea0bf;--line:#273454;--ok:#63d39a;--accent:#7ca7ff}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#eef3ff}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}h1{font-size:22px;margin:0}.badge{padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ok)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.wide{grid-column:1/-1}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 14px}.track{font-size:28px;font-weight:700;margin:3px 0}.artist{font-size:16px;color:var(--muted)}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-top:12px}.events,.files{display:grid;gap:8px}.row{display:grid;grid-template-columns:150px 90px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.row:first-child{border-top:0}.muted{color:var(--muted)}a{color:var(--accent);text-decoration:none}.empty{color:var(--muted);padding:8px 0}@media(max-width:760px){main{padding:18px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.track{font-size:22px}}
</style>
</head>
<body><main><header><div><h1 id="device">DLNA Audio Recorder</h1><div class="muted" id="base"></div></div><div class="badge" id="state">CONNECTING</div></header>
<section class="grid"><article class="card"><h2>Now Recording</h2><div class="track" id="title">等待投放…</div><div class="artist" id="artist"></div><div class="meta"><span id="album"></span><span id="duration"></span><span id="source"></span><span id="origin"></span></div></article><article class="card"><h2>Runtime</h2><div>Uptime <strong id="uptime">-</strong></div><div class="muted" style="margin-top:10px">实时状态通过 SSE 更新；媒体 URL 只显示协议与主机，不暴露签名参数。</div></article><article class="card wide"><h2>Recent protocol events</h2><div class="events" id="events"></div></article><article class="card wide"><h2>Recordings</h2><div class="files" id="files"></div></article></section></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function size(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function render(s){$('device').textContent=s.deviceName;$('base').textContent=s.baseURL;$('state').textContent=s.state;$('uptime').textContent=s.uptime;const t=s.current||{};$('title').textContent=t.title||'等待投放…';$('artist').textContent=t.artist||'';$('album').textContent=t.album?'Album: '+t.album:'';$('duration').textContent=t.duration?'Duration: '+t.duration:'';$('source').textContent=s.source?'Source: '+s.source.toUpperCase():'';$('origin').textContent=t.origin||'';$('events').innerHTML=(s.events||[]).slice().reverse().slice(0,20).map(e=>`<div class="row"><span class="muted">${new Date(e.at).toLocaleTimeString()}</span><strong>${esc(e.source||'-')}</strong><span>${esc(e.kind)} ${esc([e.artist,e.title].filter(Boolean).join(' - '))}</span><span>${esc(e.error||'')}</span></div>`).join('')||'<div class="empty">暂无事件</div>';$('files').innerHTML=(s.recordings||[]).map(f=>`<div class="row"><span class="muted">${new Date(f.time).toLocaleString()}</span><span>${size(f.size)}</span><span>${esc(f.name)}</span><a href="/recordings/${encodeURIComponent(f.name)}" target="_blank">播放 / 下载</a></div>`).join('')||'<div class="empty">还没有完成的录音</div>'}
async function load(){try{render(await (await fetch('/api/status',{cache:'no-store'})).json())}catch(e){$('state').textContent='OFFLINE'}}load();setInterval(load,10000);const es=new EventSource('/api/events');es.onmessage=()=>load();es.onerror=()=>{$('state').textContent='RECONNECTING'};
</script></body></html>
